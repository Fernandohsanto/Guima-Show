<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guima Show</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <div id="tela">https://github.com/Fernandohsanto/Guima-Show/blob/main/index.html
        <img id="imagem" src="./valor-1k.png" alt="Valor do prêmio">
    </div>

    <script>

        const imagem = document.getElementById("imagem");
        const tela = document.getElementById("tela");

        const valores = [
            "./valor-1k.png",
            "./valor-10k.png",
            "./valor-30k.png",
            "./valor-50k.png",
            "./valor-100k.png",
            "./valor-200k.png",
            "./valor-400k.png",
            "./valor-500k.png",
            "./valor-1m.png"
        ];

        let valorAtual = 0;

        tela.addEventListener("click", function () {

            if (valorAtual < valores.length - 1) {

                valorAtual++;

                imagem.src = valores[valorAtual];

            }

        });

    </script>

</body>
</html>
