<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guima Show</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

<div id="tela">
    <img id="imagem" src="./inicio.png.png" alt="Guima Show">
</div>

<script>

const tela = document.getElementById("tela");
const imagem = document.getElementById("imagem");

let telaAtual = 1;


/* ==========================================
   PRIMEIRA TELA
   Musica tema show do milhão.mp3
   ========================================== */

const musicaTema = new Audio(
    "./Musica%20tema%20show%20do%20milh%C3%A3o.mp3"
);

musicaTema.preload = "auto";
musicaTema.loop = false;


/* ==========================================
   SEGUNDA TELA
   Vai comecar o show do milhao.mp3
   ========================================== */

const musicaRegras = new Audio(
    "./Vai%20comecar%20o%20show%20do%20milhao.mp3"
);

musicaRegras.preload = "auto";
musicaRegras.loop = false;


/* ==========================================
   CLIQUE NA TELA
   ========================================== */

tela.addEventListener("click", function () {

    /* --------------------------------------
       PRIMEIRA TELA
       -------------------------------------- */

    if (telaAtual === 1) {

        /*
         * Primeiro clique:
         * inicia a música da primeira tela.
         */

        musicaTema.currentTime = 0;

        musicaTema.play().catch(function (erro) {
            console.log("Erro ao tocar música tema:", erro);
        });


        /*
         * NÃO muda de tela neste clique.
         *
         * A primeira tela continua aparecendo
         * enquanto a música toca.
         */

        return;
    }


    /* --------------------------------------
       SEGUNDA TELA
       -------------------------------------- */

    if (telaAtual === 2) {

        return;
    }

});


/* ==========================================
   SEGUNDO CLIQUE
   Vai para a tela de regras
   ========================================== */

tela.addEventListener("dblclick", function () {

    if (telaAtual === 1) {

        telaAtual = 2;

        /*
         * Para a música tema.
         */

        musicaTema.pause();
        musicaTema.currentTime = 0;


        /*
         * Troca para a tela de regras.
         */

        imagem.src = "./regras.png";


        /*
         * Toca o áudio das regras.
         */

        musicaRegras.currentTime = 0;

        musicaRegras.play().catch(function (erro) {
            console.log("Erro ao tocar áudio das regras:", erro);
        });
    }

});

</script>

</body>
</html>
