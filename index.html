<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guima Show</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            background: #000;
            cursor: pointer;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <div id="tela">

        <img
            id="imagem"
            src="inicio.png"
            alt="Guima Show"
        >

    </div>

    <script>

        const tela = document.getElementById("tela");
        const imagem = document.getElementById("imagem");

        let audioAtual = null;
        let telaAtual = 1;


        function tocarAudio(nome) {

            if (audioAtual) {
                audioAtual.pause();
                audioAtual.currentTime = 0;
            }

            audioAtual = new Audio(nome);

            audioAtual.play().catch(function(erro) {
                console.log("Áudio bloqueado pelo navegador:", erro);
            });
        }


        // PRIMEIRO CLIQUE
        // Libera o áudio e passa da Tela 1 para a Tela 2
        tela.addEventListener("click", function() {

            if (telaAtual !== 1) {
                return;
            }

            telaAtual = 2;

            // Troca a imagem
            imagem.src = "regras.png";

            // Para a música da Tela 1
            if (audioAtual) {
                audioAtual.pause();
                audioAtual.currentTime = 0;
            }

            // Toca o áudio da Tela 2
            tocarAudio("Vai%20comecar%20o%20show%20do%20milhao.mp3");

            // Não precisa mais clicar na Tela 1
            tela.style.cursor = "default";

        });


        // TENTATIVA DE TOCAR A MÚSICA DA TELA 1
        window.addEventListener("load", function() {

            audioAtual = new Audio(
                "M%C3%BAsica%20tema%20show%20do%20milh%C3%A3o.mp3"
            );

            audioAtual.play().catch(function() {

                console.log(
                    "O navegador bloqueou o áudio automático."
                );

            });

        });

    </script>

</body>
</html>
