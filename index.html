<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Guima Show</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#tela{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);aspect-ratio:16/9;background:#000;overflow:hidden}
#imagem{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;cursor:pointer}
#participanteInfo{
display:none;
position:absolute;
left:2.5%;
top:3%;
z-index:20;
width:245px;
padding:10px 12px;
border:2px solid #d8b34a;
border-radius:10px;
background:linear-gradient(180deg,rgba(8,28,14,.97),rgba(20,62,25,.95));
box-shadow:0 0 0 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);
color:#fff;
font-family:Arial,sans-serif;
text-shadow:1px 2px 3px #000;
pointer-events:none;
}
.hudTitulo{
font-size:11px;
font-weight:800;
letter-spacing:2px;
color:#ffd84a;
text-align:center;
padding-bottom:6px;
margin-bottom:7px;
border-bottom:1px solid rgba(255,216,74,.45);
}
#participanteNome{
font-size:21px;
font-weight:800;
text-align:center;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-bottom:8px;
}
.hudLinha{
display:flex;
justify-content:space-between;
align-items:center;
padding:5px 7px;
margin-top:4px;
border-radius:5px;
background:rgba(0,0,0,.28);
font-size:10px;
font-weight:700;
letter-spacing:1px;
}
.hudLinha strong{
font-size:17px;
color:#fff;
}
#participantePontos{font-size:17px;margin-top:0}
.hudProgresso{
margin-top:8px;
padding-top:7px;
border-top:1px solid rgba(255,255,255,.2);
display:grid;
grid-template-columns:1fr 1fr;
gap:3px 6px;
}
.hudValor{
font-size:10px;
color:rgba(255,255,255,.55);
padding:3px 5px;
border-radius:4px;
text-align:right;
}
.hudValor.atual{
color:#ffd84a;
background:rgba(255,216,74,.14);
font-weight:800;
}
.hudValor.feito{color:#8cff9a;}
>
