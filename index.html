<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guima Show</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

<div id="tela">
    <img id="imagem" alt="Guima Show">
</div>

<script>

const BASE = "https://raw.githubusercontent.com/Fernandohsanto/Guima-Show/main/";

const imagem = document.getElementById("imagem");

let etapa = 1;


// ==============================
// IMAGENS
// ==============================

const imagens = {
    inicio: BASE + "inicio.png.png",
    regras: BASE + "regras.png",
    ouro1: BASE + "ouro%201%20mil.PNG"
};


// ==============================
// ÁUDIOS
// ==============================

const musicaTema = new Audio(
    BASE + "Musica%20tema%20show%20do%20milh%C3%A3o.mp3"
);

const musicaRegras = new Audio(
    BASE + "Vai%20comecar%20o%20show%20do%20milhao.mp3"
);

const musica1Mil = new Audio(
    BASE + "1%20Mil.mp3"
);

musicaTema.preload = "auto";
musicaRegras.preload = "auto";
musica1Mil.preload = "auto";


// ==============================
// PARAR TODOS OS ÁUDIOS
// ==============================

function pararAudios() {

    musicaTema.pause();
    musicaTema.currentTime = 0;

    musicaRegras.pause();
    musicaRegras.currentTime = 0;

    musica1Mil.pause();
    musica1Mil.currentTime = 0;
}


// ==============================
// INÍCIO
// ==============================

function mostrarInicio() {

    etapa = 1;

    imagem.src = imagens.inicio;

    pararAudios();

    musicaTema.play().catch(() => {
        console.log("Autoplay bloqueado.");
    });
}


// ==============================
// REGRAS
// ==============================

function mostrarRegras() {

    etapa = 2;

    imagem.src = imagens.regras;

    pararAudios();

    musicaRegras.play().catch(() => {
        console.log("Áudio das regras aguardando clique.");
    });
}


// ==============================
// OURO 1 MIL
// ==============================

function mostrarOuro1Mil() {

    etapa = 3;

    imagem.src = imagens.ouro1;

    pararAudios();

    musica1Mil.play().catch(() => {
        console.log("Áudio 1 Mil ainda não disponível.");
    });
}


// ==============================
// CLIQUE
// ==============================

document.getElementById("tela").addEventListener("click", function () {

    if (etapa === 1) {

        mostrarRegras();

        return;
    }

    if (etapa === 2) {

        mostrarOuro1Mil();

        return;
    }

});


// ==============================
// CARREGAR PRIMEIRA TELA
// ==============================

window.addEventListener("load", function () {

    mostrarInicio();

});

</script>

</body>
</html>
