<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guima Show</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #inicio {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <div id="tela">
        <img
            id="inicio"
            src="inicio.png"
            alt="Guima Show"
        >
    </div>

    <audio
        id="audioInicio"
        src="Vai%20comecar%20o%20show%20do%20milhao.mp3"
        autoplay
        preload="auto">
    </audio>

    <script>
        const audio = document.getElementById("audioInicio");

        window.addEventListener("load", function () {
            audio.play().catch(function () {
                console.log("O navegador bloqueou o autoplay com som.");
            });
        });
    </script>

</body>
</html>
