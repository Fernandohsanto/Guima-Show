<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guima Show</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

<div id="tela">
    <img id="imagem" src="./inicio.png.png" alt="Guima Show">
</div>

<script>

const tela = document.getElementById("tela");
const imagem = document.getElementById("imagem");

let telaAtual = 1;


/* =========================================
   MÚSICA TEMA
   ========================================= */

const musicaTema = new Audio(
    "./M%C3%BAsica%20tema%20show%20do%20milh%C3%A3o.mp3"
);

musicaTema.preload = "auto";


/* =========================================
   ÁUDIO DAS REGRAS
   ========================================= */

const musicaRegras = new Audio(
    "./Vai%20comecar%20o%20show%20do%20milhao.mp3"
);

musicaRegras.preload = "auto";


/* =========================================
   CLIQUE
   ========================================= */

tela.addEventListener("click", function () {

    if (telaAtual === 1) {

        /*
        Primeiro clique:
        inicia a música
        */

        musicaTema.currentTime = 0;

        musicaTema.play()
            .then(function () {
                console.log("Música tema iniciou.");
            })
            .catch(function (erro) {
                console.error("Erro na música tema:", erro);
            });


        /*
        Depois muda para REGRAS
        */

        telaAtual = 2;

        imagem.src = "./regras.png";

    }

});

</script>

</body>
</html>
