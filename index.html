<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guima Show</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

<div id="tela">
    <img id="imagem" src="./inicio.png.png" alt="Guima Show">
</div>

<script>

const tela = document.getElementById("tela");
const imagem = document.getElementById("imagem");

let telaAtual = 1;


/* ==========================================
   TELA 1
   Musica tema show do milhao.mp3
   ========================================== */

const musicaTema = new Audio(
    "./Musica%20tema%20show%20do%20milh%C3%A3o.mp3"
);

musicaTema.preload = "auto";
musicaTema.loop = false;


/* ==========================================
   TELA 2
   ÁUDIO DAS REGRAS
   ========================================== */

const musicaRegras = new Audio(
    "./Vai%20comecar%20o%20show%20do%20milhao.mp3"
);

musicaRegras.preload = "auto";
musicaRegras.loop = false;


/* ==========================================
   PRIMEIRA TELA
   ========================================== */

function tocarMusicaTema() {

    musicaTema.currentTime = 0;

    musicaTema.play().catch(function(erro) {

        console.log("Erro ao tocar Musica tema show do milhao.mp3:", erro);

    });
}


/* ==========================================
   TENTA AUTOPLAY
   ========================================== */

window.addEventListener("load", function() {

    tocarMusicaTema();

});


/* ==========================================
   CLIQUE
   ========================================== */

tela.addEventListener("click", function() {

    if (telaAtual === 1) {

        /*
         * Se o autoplay foi bloqueado,
         * o clique libera a música.
         */

        if (musicaTema.paused) {
            tocarMusicaTema();
        }

        /*
         * Vai para a segunda tela.
         */

        telaAtual = 2;

        imagem.src = "./regras.png";

        /*
         * Para a Musica tema show do milhao.mp3.
         */

        musicaTema.pause();
        musicaTema.currentTime = 0;

        /*
         * Toca o áudio das regras.
         */

        musicaRegras.currentTime = 0;

        musicaRegras.play().catch(function(erro) {

            console.log("Erro ao tocar áudio das regras:", erro);

        });

    }

});

</script>

</body>
</html>
