<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guima Show</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

<div id="tela">
    <img id="imagem" src="./inicio.png.png" alt="Guima Show">
</div>

<script>

const tela = document.getElementById("tela");
const imagem = document.getElementById("imagem");

/* ==============================
   MÚSICA DA PRIMEIRA TELA
   ============================== */

const musicaTema = new Audio(
    "./M%C3%BAsica%20tema%20show%20do%20milh%C3%A3o.mp3"
);

musicaTema.preload = "auto";
musicaTema.loop = false;


/* ==============================
   TENTAR TOCAR AUTOMATICAMENTE
   ============================== */

window.addEventListener("load", function () {

    musicaTema.play().catch(function () {

        console.log("Autoplay bloqueado.");

    });

});


/* ==============================
   PRIMEIRO CLIQUE
   ============================== */

tela.addEventListener("click", function () {

    /*
     * Se a música ainda não começou,
     * o clique inicia.
     */

    if (musicaTema.paused) {

        musicaTema.play().catch(function (erro) {

            console.log("Erro ao tocar:", erro);

        });

    }

});

</script>

</body>
</html>
