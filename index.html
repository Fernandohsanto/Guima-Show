<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guima Show</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

<div id="tela">
    <img id="imagem" src="./inicio.png.png" alt="Guima Show">
</div>

<script>

const tela = document.getElementById("tela");
const imagem = document.getElementById("imagem");

let telaAtual = 1;


/* ==========================================
   ÁUDIO DA TELA 1
   ========================================== */

const musicaTema = new Audio(
    "./M%C3%BAsica%20tema%20show%20do%20milh%C3%A3o.mp3"
);

musicaTema.preload = "auto";
musicaTema.loop = false;


/* ==========================================
   ÁUDIO DA TELA 2
   ========================================== */

const musicaRegras = new Audio(
    "./Vai%20comecar%20o%20show%20do%20milhao.mp3"
);

musicaRegras.preload = "auto";
musicaRegras.loop = false;


/* ==========================================
   PRIMEIRA TELA
   ========================================== */

function iniciarMusicaTema() {

    musicaTema.currentTime = 0;

    musicaTema.play().catch(function(erro) {
        console.log("Não foi possível iniciar a música:", erro);
    });
}


/* ==========================================
   CLIQUE NA TELA
   ========================================== */

tela.addEventListener("click", function() {

    /* --------------------------------------
       TELA 1 → TELA 2
       -------------------------------------- */

    if (telaAtual === 1) {

        /*
         * O clique inicia a música da primeira tela.
         */
        iniciarMusicaTema();

        /*
         * Troca a imagem.
         */
        telaAtual = 2;

        imagem.src = "./regras.png";


        /*
         * Para a música da primeira tela
         * quando entramos na segunda.
         */
        musicaTema.pause();
        musicaTema.currentTime = 0;


        /*
         * Toca o áudio das regras.
         */
        musicaRegras.currentTime = 0;

        musicaRegras.play().catch(function(erro) {
            console.log("Não foi possível iniciar o áudio das regras:", erro);
        });
    }

});


/* ==========================================
   TENTA AUTOPLAY DA PRIMEIRA TELA
   ========================================== */

window.addEventListener("load", function() {

    musicaTema.play().catch(function() {

        /*
         * Se o navegador bloquear autoplay,
         * o áudio será liberado no clique.
         */

        console.log("Autoplay bloqueado pelo navegador.");

    });

});

</script>

</body>
</html>
