<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guima Show</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            background: #000;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <div id="tela">
        <img id="imagem" src="./inicio.png.png" alt="Guima Show">
    </div>

    <script>

        const tela = document.getElementById("tela");
        const imagem = document.getElementById("imagem");

        // ==========================================
        // MÚSICA TEMA - PRIMEIRA TELA
        // ==========================================

        const musicaTema = new Audio(
            "https://raw.githubusercontent.com/Fernandohsanto/Guima-Show/principal/M%C3%BAsica%20tema%20show%20do%20milh%C3%A3o.mp3"
        );

        musicaTema.preload = "auto";
        musicaTema.loop = false;


        // ==========================================
        // ÁUDIO DA TELA DE REGRAS
        // ==========================================

        const musicaRegras = new Audio(
            "https://raw.githubusercontent.com/Fernandohsanto/Guima-Show/principal/Vai%20comecar%20o%20show%20do%20milhao.mp3"
        );

        musicaRegras.preload = "auto";
        musicaRegras.loop = false;


        // ==========================================
        // TELA INICIAL
        // ==========================================

        let telaAtual = 1;


        // Tenta tocar automaticamente
        window.addEventListener("load", function () {

            musicaTema.play().catch(function () {
                console.log("Autoplay bloqueado. Aguardando clique.");
            });

        });


        // ==========================================
        // CLIQUE NA TELA
        // ==========================================

        tela.addEventListener("click", function () {

            // PRIMEIRO CLIQUE
            if (telaAtual === 1) {

                // Garante que a música tema comece
                musicaTema.play().catch(function (erro) {
                    console.log("Erro ao tocar música:", erro);
                });

                // Vai para a tela de regras
                telaAtual = 2;

                // Para a música tema
                musicaTema.pause();
                musicaTema.currentTime = 0;

                // Troca a imagem
                imagem.src = "./regras.png";

                // Toca o áudio das regras
                musicaRegras.currentTime = 0;

                musicaRegras.play().catch(function (erro) {
                    console.log("Erro ao tocar áudio das regras:", erro);
                });
            }

        });

    </script>

</body>
</html>
