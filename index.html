<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guima Show</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            background: #000;
            cursor: pointer;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <div id="tela">
        <img id="imagem" src="./inicio.png.png" alt="Guima Show">
    </div>

    <script>
        const tela = document.getElementById("tela");
        const imagem = document.getElementById("imagem");

        // Música da primeira tela
        const musicaTema = new Audio(
            "./M%C3%BAsica%20tema%20show%20do%20milh%C3%A3o.mp3"
        );

        // Música da tela de regras
        const musicaRegras = new Audio(
            "./Vai%20comecar%20o%20show%20do%20milhao.mp3"
        );

        musicaTema.loop = false;
        musicaRegras.loop = false;

        let telaAtual = 1;

        // Tenta iniciar a música automaticamente
        window.addEventListener("load", function () {
            musicaTema.play().catch(function () {
                console.log("Autoplay bloqueado pelo navegador.");
            });
        });

        // Clique na tela inicial
        tela.addEventListener("click", function () {

            if (telaAtual === 1) {

                telaAtual = 2;

                // Para a música da primeira tela
                musicaTema.pause();
                musicaTema.currentTime = 0;

                // Troca para a tela de regras
                imagem.src = "./regras.png";

                // Toca o áudio das regras
                musicaRegras.currentTime = 0;
                musicaRegras.play().catch(function () {
                    console.log("Áudio das regras bloqueado.");
                });
            }
        });
    </script>

</body>
</html>
