<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guima Show</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tela {
            width: 100vw;
            height: 100vh;
            background: #000;
            cursor: pointer;
        }

        #imagem {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <div id="tela">

        <img
            id="imagem"
            src="./inicio.png.png"
            alt="Guima Show"
        >

    </div>

    <script>

        const tela = document.getElementById("tela");
        const imagem = document.getElementById("imagem");

        /*
        ==================================================
        MÚSICA DA PRIMEIRA TELA
        ==================================================
        */

        const musicaTema = new Audio(
            "https://raw.githubusercontent.com/Fernandohsanto/Guima-Show/principal/M%C3%BAsica%20tema%20show%20do%20milh%C3%A3o.mp3"
        );

        musicaTema.preload = "auto";
        musicaTema.loop = false;


        /*
        ==================================================
        ÁUDIO DA TELA DE REGRAS
        ==================================================
        */

        const musicaRegras = new Audio(
            "https://raw.githubusercontent.com/Fernandohsanto/Guima-Show/principal/Vai%20comecar%20o%20show%20do%20milhao.mp3"
        );

        musicaRegras.preload = "auto";
        musicaRegras.loop = false;


        /*
        ==================================================
        TELA ATUAL
        ==================================================
        */

        let telaAtual = 1;


        /*
        ==================================================
        AUTOPLAY
        ==================================================
        */

        window.addEventListener("load", function () {

            musicaTema.play().catch(function () {

                console.log(
                    "O navegador bloqueou o autoplay."
                );

            });

        });


        /*
        ==================================================
        CLIQUE NA TELA
        ==================================================
        */

        tela.addEventListener("click", function () {

            /*
            PRIMEIRO SLIDE
            */

            if (telaAtual === 1) {

                /*
                O CLIQUE LIBERA O ÁUDIO
                */

                musicaTema.play().catch(function (erro) {

                    console.log(
                        "Erro ao iniciar música:",
                        erro
                    );

                });


                /*
                MUDA PARA A TELA DE REGRAS
                */

                telaAtual = 2;

                imagem.src = "./regras.png";


                /*
                IMPORTANTE:
                A música tema NÃO é pausada aqui.
                */

            }

        });

    </script>

</body>
</html>
